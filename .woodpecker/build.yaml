# Kotlin client tests only; publishing remains disabled during migration.
labels:
  pool: general
concurrency: 1
when:
  - event: [push, manual]
steps:
  - name: kotlin-desktop-tests
    image: eclipse-temurin:21-jdk
    commands:
      - apt-get update && apt-get install -y --no-install-recommends git python3 xvfb xauth fontconfig libxi6 libxtst6 libxrender1 libgl1
      - sh .woodpecker/build.sh
